title: Climate
path: climate
icon: mdi:thermostat
type: panel
cards:
  - type: custom:button-card
    template: base
    styles:
      card:
        - height: 100vh
        - background: var(--example-bg)
        - padding: 12px 24px 12px 0
      grid:
        - grid-template-areas: '"rail head" "rail body"'
        - grid-template-columns: 96px minmax(0, 1fr)
        - grid-template-rows: 104px minmax(0, 1fr)
        - column-gap: 8px
        - row-gap: 12px
    custom_fields:
      rail:
        card:
            type: vertical-stack
            cards:
              - type: custom:button-card
                template: rail_item
                name: Home
                icon: mdi:view-grid-outline
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/home
              - type: custom:button-card
                template: rail_item
                name: Lounge
                icon: mdi:sofa-outline
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: Studio
                icon: mdi:desk
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: Rooms
                icon: mdi:door-open
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/rooms
              - type: custom:button-card
                template: rail_item
                name: Security
                icon: mdi:shield-home-outline
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/security
              - type: custom:button-card
                template: rail_item
                name: Climate
                icon: mdi:thermostat
                variables:
                  attivo: true
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:button-card
                template: rail_item
                name: Garage
                icon: mdi:garage-variant
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/garage
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: 3D map
                icon: mdi:floor-plan
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                entity: input_boolean.night_mode_example
                name: Night
                icon: mdi:weather-night
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/night
                variables:
                  attivo: false
      head:
        card:
          type: markdown
          content: >
            ## Example data · Climate


            Wednesday 18 March · bind the clock and weather to your own sensors.
      body:
        card:
          type: vertical-stack
          cards:
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  template: status_card
                  name: House
                  label: average of the rooms
                  icon: mdi:home-thermometer-outline
                  entity: sensor.indoor_temp_example
                - type: custom:button-card
                  template: status_card
                  name: Outdoor
                  label: low 8° · high 16° (example)
                  icon: mdi:weather-partly-cloudy
                  entity: sensor.outdoor_temp_example
                - type: custom:button-card
                  template: status_card
                  name: Air quality
                  label: "PM2.5 9 · PM10 14 µg/m³"
                  icon: mdi:blur
                  entity: sensor.air_quality_example
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  template: climate_tile
                  name: Lounge
                  label: Set to 21° · Heat
                  entity: climate.lounge_example
                - type: custom:button-card
                  template: climate_tile
                  name: Studio
                  label: Set to 21° · Heat
                  entity: climate.studio_example
                - type: custom:button-card
                  template: climate_tile
                  name: Kitchen
                  label: Set to 21° · Heat
                  entity: climate.kitchen_example
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  template: climate_tile
                  name: Bedroom
                  label: Set to 18° · Off
                  entity: climate.bedroom_example
                - type: custom:button-card
                  template: climate_tile
                  name: Bath
                  label: Set to 21° · Off
                  entity: climate.bath_example
                - type: custom:button-card
                  template: climate_tile
                  name: Terrace
                  label: Outdoor (example)
                  entity: sensor.terrace_temp_example

