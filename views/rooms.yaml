title: Rooms
path: rooms
icon: mdi:door-open
type: panel
cards:
  - type: custom:button-card
    template: base
    styles:
      card:
        - height: 100vh
        - background: var(--example-bg)
        - padding: 12px 24px 12px 0
      grid:
        - grid-template-areas: '"rail head" "rail body"'
        - grid-template-columns: 96px minmax(0, 1fr)
        - grid-template-rows: 104px minmax(0, 1fr)
        - column-gap: 8px
        - row-gap: 12px
    custom_fields:
      rail:
        card:
            type: vertical-stack
            cards:
              - type: custom:button-card
                template: rail_item
                name: Home
                icon: mdi:view-grid-outline
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/home
              - type: custom:button-card
                template: rail_item
                name: Lounge
                icon: mdi:sofa-outline
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: Studio
                icon: mdi:desk
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: Rooms
                icon: mdi:door-open
                variables:
                  attivo: true
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/rooms
              - type: custom:button-card
                template: rail_item
                name: Security
                icon: mdi:shield-home-outline
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/security
              - type: custom:button-card
                template: rail_item
                name: Climate
                icon: mdi:thermostat
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:button-card
                template: rail_item
                name: Garage
                icon: mdi:garage-variant
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/garage
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: 3D map
                icon: mdi:floor-plan
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                entity: input_boolean.night_mode_example
                name: Night
                icon: mdi:weather-night
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/night
                variables:
                  attivo: false
      head:
        card:
          type: markdown
          content: >
            ## Example data · Rooms


            Wednesday 18 March · bind the clock and weather to your own sensors.
      body:
        card:
          type: horizontal-stack
          cards:
            - type: picture
              image: /local/img/example-plan.png
              alt: Fictional example apartment plan with sample room states
            - type: vertical-stack
              cards:
                - type: custom:button-card
                  template: room_tile
                  name: Lounge
                  label: 2 lights on
                  icon: mdi:sofa-outline
                  entity: sensor.lounge_temp_example
                  variables:
                    acceso: true
                - type: custom:button-card
                  template: room_tile
                  name: Studio
                  label: 2 lights on
                  icon: mdi:desk
                  entity: sensor.studio_temp_example
                  variables:
                    acceso: true
                - type: custom:button-card
                  template: room_tile
                  name: Kitchen
                  label: 1 light on
                  icon: mdi:stove
                  entity: sensor.kitchen_temp_example
                  variables:
                    acceso: true
                - type: custom:button-card
                  template: room_tile
                  name: Bedroom
                  label: all off
                  icon: mdi:bed-king-outline
                  entity: sensor.bedroom_temp_example
                - type: custom:button-card
                  template: room_tile
                  name: Bath
                  label: all off
                  icon: mdi:shower
                  entity: sensor.bath_temp_example
                - type: custom:button-card
                  template: room_tile
                  name: Terrace
                  label: covers closed
                  icon: mdi:balcony
                  entity: sensor.terrace_temp_example

