title: Night wall
path: night
icon: mdi:weather-night
type: panel
cards:
  - type: custom:button-card
    template: base
    styles:
      card:
        - height: 100vh
        - background: var(--example-bg)
        - padding: 12px 24px 12px 0
      grid:
        - grid-template-areas: '"rail head" "rail body"'
        - grid-template-columns: 96px minmax(0, 1fr)
        - grid-template-rows: 104px minmax(0, 1fr)
        - column-gap: 8px
        - row-gap: 12px
    custom_fields:
      rail:
        card:
            type: vertical-stack
            cards:
              - type: custom:button-card
                template: rail_item
                name: Home
                icon: mdi:view-grid-outline
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/home
              - type: custom:button-card
                template: rail_item
                name: Lounge
                icon: mdi:sofa-outline
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: Studio
                icon: mdi:desk
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: Rooms
                icon: mdi:door-open
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/rooms
              - type: custom:button-card
                template: rail_item
                name: Security
                icon: mdi:shield-home-outline
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/security
              - type: custom:button-card
                template: rail_item
                name: Climate
                icon: mdi:thermostat
                variables:
                  attivo: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:button-card
                template: rail_item
                name: Garage
                icon: mdi:garage-variant
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/garage
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                name: 3D map
                icon: mdi:floor-plan
                variables:
                  attivo: false
              - type: custom:button-card
                template: rail_item
                entity: input_boolean.night_mode_example
                name: Night
                icon: mdi:weather-night
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/night
                variables:
                  attivo: true
      head:
        card:
          type: markdown
          content: >
            ## Example data · Night wall


            Wednesday 18 March · bind the clock and weather to your own sensors.
      body:
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >
                # 22:40

                Wednesday 18 March · House 20.5° (example)
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  template: action_pill
                  name: Lights off
                  label: 3 were on
                  icon: mdi:lightbulb-group-outline
                  entity: script.turn_off_lights_example
                  variables:
                    tono: amb
                  tap_action:
                    action: call-service
                    service: script.turn_off_lights_example
                - type: custom:button-card
                  template: action_pill
                  name: Covers down
                  label: day and night
                  icon: mdi:window-shutter
                  entity: script.covers_down_example
                  variables:
                    tono: neutro
                - type: custom:button-card
                  template: action_pill
                  name: Good night
                  label: lights, covers, alarm
                  icon: mdi:weather-night
                  entity: script.good_night_example
                  variables:
                    tono: acc
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  template: status_card
                  name: Alarm
                  label: disarmed
                  icon: mdi:shield-home-outline
                  entity: alarm_control_panel.home_example
                - type: custom:button-card
                  template: status_card
                  name: Lights
                  label: 3 on
                  icon: mdi:lightbulb-outline
                - type: custom:button-card
                  template: status_card
                  name: Robot
                  label: docked
                  icon: mdi:robot-vacuum
                  entity: vacuum.robot_example

