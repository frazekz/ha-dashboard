sensor_tile:
  template: base
  show_icon: true
  show_name: true
  show_label: true
  styles:
    card:
      - border-radius: 20px
      - padding: 12px 14px
      - background: var(--example-card)
      - box-shadow: inset 0 0 0 1px var(--example-line)
    grid:
      - grid-template-areas: '"i" "n" "l"'
      - justify-items: start
    icon:
      - width: 26px
      - height: 26px
      - color: var(--example-accent-text)
    name:
      - font-size: 15px
      - font-weight: 800
    label:
      - font-size: 13px
      - font-weight: 700
      - color: var(--example-accent)
